@if (lastOperationRound?.status !== TaskStatus.READY) {
  <tportal-proceedings-table-op-icon
    [storeTaskOperation]="storeTaskOperation"
    [title]="$safeNavigationMigration(lastOperationRound?.status)"
  ></tportal-proceedings-table-op-icon>
} @else {
  <i class="bi bi-pencil-square link" aria-hidden="true"></i>
}
